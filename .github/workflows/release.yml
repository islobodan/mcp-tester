name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Display version
        run: echo "Releasing version ${{ steps.get_version.outputs.VERSION }}"

      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "Error: Tag version ${{ steps.get_version.outputs.VERSION }} does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "✓ Version matches: $PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build TypeScript
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Generating release notes for version $VERSION"

          if [ -f "CHANGELOG.md" ]; then
            # Extract this version's section: from its `## [x.y.z]` header
            # up to (but not including) the next `## ` heading.
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { in_version = 1; next }
              in_version && /^## \[/ { exit }
              in_version { print }
            ' CHANGELOG.md > final_notes.txt

            if [ -s final_notes.txt ]; then
              # Set output
              {
                echo 'notes<<EOF'
                cat final_notes.txt
                echo EOF
              } >> $GITHUB_OUTPUT

              echo "✓ Release notes generated"
              cat final_notes.txt
            else
              echo "## What's Changed" > final_notes.txt
              echo "" >> final_notes.txt
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> final_notes.txt

              {
                echo 'notes<<EOF'
                cat final_notes.txt
                echo EOF
              } >> $GITHUB_OUTPUT

              echo "⚠ No specific changelog entries found for version $VERSION"
            fi
          else
            echo "⚠ No CHANGELOG.md found"
            {
              echo 'notes<<EOF'
              echo "## What's Changed"
              echo ""
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
              echo EOF
            } >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        id: npm_publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create "v${{ steps.get_version.outputs.VERSION }}" \
            --title "Release v${{ steps.get_version.outputs.VERSION }}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  verify:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install published package
        run: npm install "@slbdn/mcp-tester@${{ steps.get_version.outputs.VERSION }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package installation
        run: |
          if [ -d "node_modules/@slbdn/mcp-tester" ]; then
            echo "✓ Package installed successfully"
            ls -la node_modules/@slbdn/mcp-tester/
          else
            echo "✗ Package installation failed"
            exit 1
          fi

      - name: Verify package exports
        run: |
          node -e "const pkg = require('./node_modules/@slbdn/mcp-tester/package.json'); console.log('Main:', pkg.main); console.log('Types:', pkg.types);"

      - name: Quick import test
        run: |
          node --input-type=module -e "import { MCPClient } from '@slbdn/mcp-tester'; if (!MCPClient) throw new Error('MCPClient export missing'); console.log('✓ Package imports correctly');"
